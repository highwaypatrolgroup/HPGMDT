<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src data:; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPG · MDT</title>
<style>
:root{--bg:#000;--bg2:#161616;--p1:#0c0c0c;--p2:#171717;--bd:#2c2c2c;--tx:#f3f3f3;--mu:#8e8e8e;--ac:#fff;--on:#000;--er:#ff5252;color-scheme:dark}
:root[data-theme=light]{--bg:#ececec;--bg2:#fff;--p1:#fff;--p2:#f1f1f1;--bd:#d2d2d2;--tx:#101010;--mu:#6a6a6a;--ac:#000;--on:#fff;--er:#c20000;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input,select,textarea{font:inherit;color:var(--tx)}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--bd)}
.bar img{height:30px;width:auto}.bar b{letter-spacing:2px}.sp{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);display:inline-block}.dot.on{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.tabs{display:flex;background:var(--p1);border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs button{flex:1;min-width:76px;padding:11px 6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);cursor:pointer;letter-spacing:1px;font-size:12px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);background:var(--p2)}
main{flex:1;overflow:auto;padding:12px;max-width:980px;width:100%;margin:0 auto}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:2px;color:var(--mu);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[readonly]{opacity:.75}
textarea{min-height:64px;resize:vertical}
label.l{display:block;margin:10px 0 4px;color:var(--mu);font-size:11px;letter-spacing:1px}
.btn{background:var(--ac);color:var(--on);border:1px solid var(--ac);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn.g{background:transparent;color:var(--tx);border-color:var(--bd)}.btn.g:hover{border-color:var(--ac)}.btn:disabled{opacity:.5}.btn.sm{padding:6px 10px;font-size:12px}
.item{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;background:var(--p2);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item:hover{border-color:var(--ac)}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--tx);white-space:nowrap}
.pill.ok{background:var(--ac);color:var(--on);border-color:var(--ac)}.pill.wn{border-style:dashed}.pill.er{color:var(--er);border-color:var(--er)}.pill.mu{color:var(--mu);border-color:var(--bd)}
.alert{padding:10px 12px;border-radius:8px;margin:8px 0;border:1px solid var(--er);color:var(--er);font-weight:700}.alert.wn{border-color:var(--tx);color:var(--tx);border-style:dashed}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}.kv span{color:var(--mu)}
.head{display:flex;gap:12px;align-items:flex-start}.head img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-size:11px;font-weight:600}
.vl label{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:pointer}.vl input{margin-right:8px;accent-color:var(--ac)}
.muted{color:var(--mu)}.err{color:var(--er);min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw;font-weight:700}
/* login / onboarding */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1000px 520px at 50% -10%,var(--bg2),var(--bg));position:relative;overflow:auto}
.stage .tg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.panel{width:min(400px,100%);background:var(--p1);border:1px solid var(--bd);border-radius:16px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel .logo{display:block;margin:0 auto 12px;height:116px;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.panel h1{margin:0;text-align:center;font-size:20px;letter-spacing:4px}
.panel .sub{text-align:center;color:var(--mu);font-size:11px;letter-spacing:3px;margin:4px 0 20px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);cursor:pointer;padding:6px 8px;font-size:11px;letter-spacing:1px}
.foot{margin-top:16px;text-align:center;color:var(--mu);font-size:11px;line-height:1.6}
.hr{height:1px;background:var(--bd);margin:16px 0}
.seg{display:flex;gap:8px}.seg button{flex:1}
</style>
</head>

 return new Promise(res=>{let pend=cols.length,done=false;const one=()=>{if(!done&&--pend<=0){done=true;res()}};
  cols.forEach(n=>{let first=true;
   UNSUB.push(FS.collection(n).onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{if(ch.type==="removed")delete SH[ch.doc.ref.path];else{SH[ch.doc.ref.path]=ch.doc.data();if(ch.type==="added"&&!first&&P&&!ch.doc.metadata.hasPendingWrites)notifyNew(ch.doc.data())}});
    online=true;if(first){first=false;one()}else softRender()},
   err=>{console.error(n,err);denied[n]=true;if(first){first=false;one()}else softRender()}))});
  setTimeout(()=>{if(!done){done=true;res()}},8000)})}

/* Non-vehicle data lives in the existing "violations" collection, told apart by the k field, so no new Firestore rules are needed. Status changes are appended as events (no updates/deletes). */
const subs=()=>{const g={};list("subjects").forEach(e=>(g[e.u]=g[e.u]||[]).push(e));return Object.keys(g).map(u=>{const b=lastBound(u),ev=g[u].filter(e=>e.id>b).sort((a,c)=>a.id-c.id);if(!ev.length)return null;const l=ev[ev.length-1];return{u,name:l.name,st:l.st,hist:ev.map(e=>({ts:e.ts,st:e.st,by:e.by,rbx:e.rbx,note:e.note}))}}).filter(Boolean)},subj=u=>subs().find(s=>s.u===lc(u));

 return `<div class="card"><h3>ARREST / CLEARANCE LOG · ${L.length}</h3>${L.length?`<table><tr><th>WHEN</th><th>PLAYER</th><th>OUTCOME</th></tr>${L.map(l=>`<tr><td>${esc((l.ts||"").slice(0,16).replace("T"," "))}</td><td>${esc(l.name)}</td><td><span class="pill ${scls(l.st)}">${esc(l.st)}</span><br><span class="muted">${esc(l.rbx||l.by||"")}${l.note?" · "+esc(l.note):""}</span>${(l.cids||[]).map(id=>cm[id]?`<div class="muted" style="margin-top:4px">${esc(cm[id].off)} · ${esc(cm[id].date||"")}</div>${prf(cm[id])}`:"").join("")}</td></tr>`).join("")}</table>`:'<div class="muted">No arrests or clearances logged yet.</div>'}</div>`};
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};i.src=r.result};r.readAsDataURL(f)});
const proofUI=()=>`<label class="l">PROOF OF VIOLATION (REQUIRED)</label><input id="pv" type="file" accept="image/*" style="width:100%"><div id="pvp"></div><label class="l">PROOF OF WARNING GIVEN TO VIOLATOR (REQUIRED)</label><input id="pw2" type="file" accept="image/*" style="width:100%"><div id="pwp"></div>`;
function proofWire(){const st={v:"",w:""};[["pv","pvp","v"],["pw2","pwp","w"]].forEach(([i,p,k])=>$("#"+i).onchange=async e=>{const f=e.target.files[0];st[k]="";$("#"+p).innerHTML="";if(!f)return;if(!/^image\//.test(f.type)){e.target.value="";return toast("Images only")}try{st[k]=await shrink(f);$("#"+p).innerHTML=`<img src="${st[k]}" alt="" style="max-width:120px;max-height:90px;margin-top:6px;border-radius:6px;border:1px solid var(--bd)">`}catch{toast("Couldn’t read that image")}});return st}
const prf=x=>(x.pv||x.pw)?`<div style="margin-top:4px">${[["Proof of violation",x.pv],["Proof of warning given",x.pw]].map(([t,p])=>safeImg(p)?`<img class="pf" src="${safeImg(p)}" title="${t}" alt="${t}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);margin-right:4px;cursor:pointer">`:"").join("")}</div>`:"";
document.addEventListener("click",e=>{const t=e.target;if(t.classList&&t.classList.contains("pf")){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99";o.innerHTML=`<img src="${t.src}" alt="" style="max-width:96%;max-height:96%">`;o.onclick=()=>o.remove();document.body.appendChild(o)}});
const wrow=x=>`<tr><td>${esc(x.date||"")} ${esc(x.time||"")}</td><td>${esc(x.name)}</td><td>${esc(x.off)}<br><span class="muted">${esc(x.loc||"")} · ${esc(x.by||"")}</span>${prf(x)}</td></tr>`;

const recentW=()=>{const L=cits().sort((a,b)=>b.id-a.id).slice(0,30);return`<h3>RECENT WARNINGS</h3>${L.length?`<table><tr><th>WHEN</th><th>PLAYER</th><th>OFFENSE</th></tr>${L.map(wrow).join("")}</table>`:'<div class="muted">None yet.</div>'}`};
function citView(){
 const L=cits().sort((a,b)=>b.id-a.id).slice(0,30);
 $("#v").innerHTML=`${warn("violations")}<div class="card"><h3>ISSUE WARNING · NON-VEHICLE</h3><div class="muted" style="font-size:12px">Every citation is a warning. 3 warnings = automatic arrest.</div>
 <label class="l">ROBLOX USERNAME</label><input id="cu" type="text" autocapitalize="off" autocomplete="off" maxlength="20"><div id="cw" class="muted" style="margin-top:6px"></div>
 <div id="cx" style="display:none;margin-top:10px;padding:10px;border:1px dashed var(--tx);border-radius:8px"><b>3RD WARNING · WHAT HAPPENED? (REQUIRED)</b>
  <label class="l" style="display:flex;gap:8px;align-items:center"><input type="radio" name="oc" value="arrested" style="width:auto"> ARRESTED BY ME</label>
  <label class="l" style="display:flex;gap:8px;align-items:center"><input type="radio" name="oc" value="left" style="width:auto"> LEFT THE GAME</label></div>
 <label class="l">OFFENSE</label><select id="co">${OFF.map(x=>`<option>${x}</option>`).join("")}</select>
 <div class="row"><div><label class="l">DATE</label><input id="cd" type="date" value="${today()}"></div><div><label class="l">TIME</label><input id="ct" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div>
 <label class="l">LOCATION</label><input id="cl" type="text"><label class="l">APPREHENDING OFFICER</label><input type="text" value="${esc(P.rbx)}" readonly><label class="l">NOTES</label><textarea id="cn"></textarea>
 ${proofUI()}<div class="err" id="er"></div><button class="btn" id="cs" style="width:100%;padding:12px">ISSUE WARNING</button></div>
 <div class="card" id="rw"><h3>RECENT WARNINGS</h3>${L.length?`<table><tr><th>WHEN</th><th>PLAYER</th><th>OFFENSE</th></tr>${L.map(wrow).join("")}</table>`:'<div class="muted">None yet.</div>'}</div>`;
 $("#cu").oninput=()=>{const u=$("#cu").value,s=subj(u);$("#cx").style.display=u.trim()&&warnsOf(u).length>=2&&(!s||s.st==="Clear")?"block":"none";$("#cw").innerHTML=u.trim()?`Current warnings: <b>${warnsOf(u).length}/3</b>${s&&s.st!=="Clear"?` · <span class="pill ${scls(s.st)}">${esc(s.st)}</span>`:""}`:""};
 const PR=proofWire();
 $("#cs").onclick=async()=>{const name=$("#cu").value.trim(),loc=$("#cl").value.trim(),er=m=>$("#er").textContent=m;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(name))return er("Enter a valid Roblox username.");if(!loc)return er("Enter the location.");
  if(!PR.v)return er("Upload proof of the violation.");if(!PR.w)return er("Upload proof of the warning given to the violator.");
  const s0=subj(name),third=warnsOf(name).length>=2&&(!s0||s0.st==="Clear"),oc=($("input[name=oc]:checked")||{}).value;
  if(third&&!oc)return er("Tick whether the violator was arrested or left the game.");
  const id=nid(),c={id,u:lc(name),name,off:$("#co").value,date:$("#cd").value||today(),time:$("#ct").value,loc,by:P.rbx,rank:P.rank,notes:$("#cn").value.trim(),pv:PR.v,pw:PR.w,out:third?oc:""},doc={k:"citations",n:"",j:JSON.stringify(c),e:""};
  $("#cs").disabled=true;
  try{await FS.doc("violations/"+id).set(doc);SH["violations/"+id]=doc;const n=warnsOf(name).length,s=subj(name);
   if(n>=3&&(!s||s.st==="Clear")){if(oc==="arrested"){await setStatus(name,name,"Arrested","Arrested by "+P.rbx+" at 3rd warning",true);toast(name+" arrested: moved to log",4500)}else{await setStatus(name,name,"Wanted","Left the game at 3rd warning");toast(name+" left the game: marked WANTED",4500)}}
   else toast("Warning "+n+"/3 issued to "+name,3000);citView()}
  catch(e){console.error(e);$("#cs").disabled=false;er("Could not save. You may not have permission.")}}}

function wntView(){
 const flag=subs().filter(s=>s.st&&s.st!=="Clear").sort((a,b)=>STS.indexOf(a.st)-STS.indexOf(b.st)||0);
 $("#v").innerHTML=`${warn("violations")}<div class="card"><h3>SUBJECT LOOKUP</h3><input id="q" type="text" placeholder="Roblox username" autocomplete="off" autocapitalize="off"><div id="res"></div></div><div id="det"></div>
 <div class="card"><h3>WANTED / ARRESTED BOARD · ${flag.length}</h3>${flag.map(s=>`<div class="item" data-u="${esc(s.u)}"><span><b>${esc(s.name)}</b></span><span class="pill ${scls(s.st)}">${esc(s.st)}</span></div>`).join("")||'<div class="muted">No flagged subjects.</div>'}</div>`;
 const open=u=>{sel.sj=u;wntView()};
 $$(".item[data-u]").forEach(i=>i.onclick=()=>open(i.dataset.u));
 $("#q").oninput=()=>{const q=lc($("#q").value);if(q.length<2){$("#res").innerHTML="";return}
  const names={};subs().concat(cits()).forEach(x=>{if(x.u.includes(q))names[x.u]=x.name});
  if(/^[a-z0-9_]{3,20}$/.test(q)&&!names[q])names[q]=$("#q").value.trim();
  $("#res").innerHTML=Object.keys(names).slice(0,8).map(u=>`<div class="item" data-u="${esc(u)}"><span><b>${esc(names[u])}</b></span><span class="muted">${warnsOf(u).length}/3</span></div>`).join("");
  $$("#res .item").forEach(i=>i.onclick=()=>open(i.dataset.u))};
 if(!sel.sj)return;
 const u=sel.sj,s=subj(u),w=warnsOf(u),nm=(s&&s.name)||(w[0]&&w[0].name)||u,st=s?s.st:"Clear";
 $("#det").innerHTML=`<div class="card"><h3>SUBJECT</h3>${st==="Wanted"||st==="Active Warrant"?`<div class="alert">${esc(st.toUpperCase())}</div>`:""}
  <div class="kv"><span>Username</span><b>${esc(nm)}</b><span>Status</span><div><span class="pill ${scls(st)}">${esc(st)}</span></div><span>Warnings</span><b style="${w.length>=3?"color:var(--er)":""}">${w.length}/3</b></div>
  ${w.length?`<table style="margin-top:10px"><tr><th>WHEN</th><th>PLAYER</th><th>OFFENSE</th></tr>${w.map(wrow).join("")}</table>`:""}
  ${canMark()?`<label class="l">UPDATE STATUS (STAFF)</label><input id="sn" type="text" placeholder="Note, e.g. left the game / arrest confirmed"><div class="row" style="margin-top:8px">${STS.map(x=>`<button class="btn ${x===st?"":"g"}" data-st="${x}">${x.toUpperCase()}</button>`).join("")}</div><div class="muted" style="font-size:11px;margin-top:6px">Arrested or Clear removes the record from the board and moves it to the LOG tab.</div>`:'<div class="muted" style="margin-top:10px">Only staff can change status.</div>'}</div>
  ${s&&s.hist&&s.hist.length?`<div class="card"><h3>STATUS HISTORY</h3><table><tr><th>WHEN</th><th>STATUS</th><th>BY</th></tr>${s.hist.slice().reverse().map(h=>`<tr><td>${esc((h.ts||"").slice(0,16).replace("T"," "))}</td><td>${esc(h.st)}</td><td>${esc(h.rbx||h.by||"")}<br><span class="muted">${esc(h.note||"")}</span></td></tr>`).join("")}</table></div>`:""}`;
 $$("[data-st]").forEach(b=>b.onclick=async()=>{try{const st2=b.dataset.st;await setStatus(u,nm,st2,$("#sn").value.trim(),true);if(st2==="Arrested"||st2==="Clear")sel.sj=null;toast(nm+" → "+b.dataset.st);wntView()}catch(e){console.error(e);toast("Could not update status")}})}

/* ---------- boot ---------- */
(async function(){
 if(!window.firebase){app('<div class="stage"><div class="panel">Couldn’t load Firebase. Check your connection.</div></div>');return}
 try{firebase.initializeApp(FIREBASE_CONFIG);FS=firebase.firestore();AUTH=firebase.auth();try{await AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION)}catch{}
  const u=await new Promise(r=>{const off=AUTH.onAuthStateChanged(x=>{off();r(x)})});
  if(u){const r=await resolveRole(u);if(r.role){S=r;await startSync();return afterAuth()}await AUTH.signOut()}
  login()}catch(e){console.error(e);login("Startup error. Reload the page.")}})();
</script>
</body>
</html>
